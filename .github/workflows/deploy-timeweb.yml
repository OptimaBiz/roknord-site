name: Deploy production to Timeweb

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

env:
  ASTRO_TELEMETRY_DISABLED: "1"

concurrency:
  group: timeweb-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Install SSH deployment client
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Deploy frontend over SSH
        env:
          TIMEWEB_SSH_USER: ${{ secrets.TIMEWEB_SSH_USER }}
          TIMEWEB_SSH_PASSWORD: ${{ secrets.TIMEWEB_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$TIMEWEB_SSH_USER"
          test -n "$TIMEWEB_SSH_PASSWORD"
          export SSHPASS="$TIMEWEB_SSH_PASSWORD"
          sshpass -e rsync -az --delete --timeout=30 \
            --exclude='*.mp4' \
            --exclude='*.webm' \
            -e 'ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15' \
            ./dist/ "$TIMEWEB_SSH_USER@vh348.timeweb.ru:roknord/public_html/"
